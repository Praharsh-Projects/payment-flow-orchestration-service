server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: payment-flow-service
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

payments:
  api-key: ${PAYMENTS_API_KEY:local-review-key}
  events-topic: ${PAYMENTS_EVENTS_TOPIC:payment-status-events}
  outbox-batch-size: 25
  outbox-delay-ms: 500
  outbox-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=payment-flow trace=%X{traceId:-none} logger=%logger{36} message=%msg%n"
