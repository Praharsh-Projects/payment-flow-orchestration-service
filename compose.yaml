services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v25.1.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports:
      - "9092:9092"

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,kafka
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USER: payments
      DATABASE_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      PAYMENTS_API_KEY: local-review-key
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    environment:
      PAYMENTS_API_URL: http://backend:8080
      PAYMENTS_API_KEY: local-review-key
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  payment-data:
